<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Westmoor music</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
</head>
<body>
<!-- Скрытая страница внутри игры: продолжает музыку загрузочного экрана, пока игрок выбирает
     и создаёт персонажа. Управляется из lua/rploading/cl_music.lua. -->
<script src="wm.js"></script>
<script>
(function () {
    "use strict";
    function lua(fn, arg) {
        try { if (window.westmoor && window.westmoor[fn]) window.westmoor[fn](arg); } catch (e) {}
    }
    WM.onVolume = function (v) { lua("volume", v); };
    WM.onTrack = function (title) { lua("track", title); };
    WM.onDone = function () { lua("done", 1); };

    // громкость: та, что выставили на загрузочном экране в этом запуске игры, иначе — из игры (#vol=0.6)
    var m = /vol=([0-9.]+)/.exec(location.hash);
    var fromLua = m ? parseFloat(m[1]) : 0.6;
    var stored = WM.storedVolume();
    var v = stored !== null ? stored : (isNaN(fromLua) ? 0.6 : fromLua);
    WM.setVolume(v, true);
    if (stored !== null && Math.abs(stored - fromLua) > 0.001) {
        // в игре сохраняем то, что игрок выбрал на загрузочном экране (westmoor.* появляется чуть позже)
        setTimeout(function () { lua("volume", stored); }, 300);
        setTimeout(function () { lua("volume", stored); }, 1500);
    }
    var mm = /master=([0-9.]+)/.exec(location.hash);
    if (mm) WM.setMaster(parseFloat(mm[1]));
    WM.start("game");
})();
</script>
</body>
</html>
